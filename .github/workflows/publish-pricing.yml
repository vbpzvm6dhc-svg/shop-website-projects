name: Publish LUCEN DESIGN website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4
      - name: Confirm required pages exist
        run: |
          test -s index.html
          test -s services/index.html
          test -s works/index.html
          test -s process/index.html
          test -s faq/index.html
          test -s contact/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload full website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
